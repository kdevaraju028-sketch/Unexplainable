/* ===== v18 NOVA: Iron-Man style 3D HUD interface ===== */
#novaBg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; display: none; }
body.nova #novaBg { display: block; }
#novaBg .sky { position: absolute; inset: 0; background: radial-gradient(900px 520px at 12% -8%, rgba(var(--accRGB),.3), transparent 62%), radial-gradient(700px 480px at 108% 6%, rgba(255,96,40,.18), transparent 60%), linear-gradient(180deg, #040812 0%, #06122a 55%, #040812 100%); }
#novaBg canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .6; }
#novaBg .floor { position: absolute; left: -60%; right: -60%; bottom: -6%; height: 48%; transform: perspective(520px) rotateX(64deg); transform-origin: 50% 100%; background-image: linear-gradient(rgba(var(--accRGB),.38) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--accRGB),.38) 1px, transparent 1px); background-size: 48px 48px; animation: novaFloor 7s linear infinite; -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 88%); mask-image: linear-gradient(to top, #000 10%, transparent 88%); opacity: .5; }
@keyframes novaFloor { to { background-position: 0 48px; } }
body.nova { background: #050a14 !important; color: #e8f7ff; }
body.nova #appBg { z-index: 0; }
/* header with a spinning 3D arc reactor */
.arc { position: relative; width: 46px; height: 46px; flex: 0 0 46px; perspective: 260px; margin-right: 12px; display: none; }
body.nova .arc { display: block; }
.arc i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--acc); box-shadow: 0 0 12px var(--acc), inset 0 0 10px rgba(var(--accRGB),.6); }
.arc i:nth-child(1) { animation: arcA 5s linear infinite; } .arc i:nth-child(2) { inset: 6px; border-color: #ffc13b; box-shadow: 0 0 10px #ffc13b; animation: arcB 4s linear infinite; } .arc i:nth-child(3) { inset: 12px; border-style: dashed; border-color: #8ff3ff; animation: arcA 3s linear infinite reverse; }
.arc b { position: absolute; inset: 17px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, #aaf6ff 40%, var(--acc) 100%); box-shadow: 0 0 18px 6px rgba(var(--accRGB),.8); animation: arcPulse 2.4s ease-in-out infinite; }
@keyframes arcA { to { transform: rotateY(360deg) rotateX(20deg); } } @keyframes arcB { to { transform: rotateX(360deg) rotateY(30deg); } } @keyframes arcPulse { 50% { box-shadow: 0 0 26px 10px rgba(var(--accRGB),.95); } }
body.nova .app-top-bar { justify-content: flex-start; gap: 0; } body.nova .app-top-bar #lockBtn { margin-left: auto; }
body.nova h1#greet { font-weight: 700; letter-spacing: 4px; font-size: 19px; text-transform: uppercase; background: linear-gradient(90deg, #9ff3ff, #fff 45%, #ffd36b); -webkit-background-clip: text; background-clip: text; color: transparent !important; filter: drop-shadow(0 0 8px rgba(var(--accRGB),.55)); }

body.nova #menuBtn, body.nova #commBtn, body.nova #bellBtn, body.nova #calBtn { background: linear-gradient(180deg, rgba(var(--accRGB),.18), rgba(0,110,255,.08)) !important; border: 1px solid rgba(var(--accRGB),.5) !important; color: #c4f7ff !important; border-radius: 12px; padding: 8px 11px; margin: 0 4px 8px 0; font-size: 13px; font-weight: 600; letter-spacing: .4px; box-shadow: 0 0 12px rgba(var(--accRGB),.2), inset 0 0 12px rgba(var(--accRGB),.08); transition: transform .15s, box-shadow .2s; }

function detectMood(text) {
  const lower = text.toLowerCase();
  let scores = {};
  for (const mood in MOOD_KEYWORDS) {

    MOOD_KEYWORDS[mood].forEach(w => { if (lower.includes(w)) scores[mood]++; });

  let top = 'neutral', max = 0;
  for (const m in scores) { if (scores[m] > max) { max = scores[m]; top = m; } }

}

/* ---------- Encryption: notes are locked on the device before they go online ---------- */

async function pushCloud() {

}

async function overlayUnlock() {
  const err = ge('loErr');

// -- secure logout: save, sign out, wipe, leave
async function wipeMedia(id) {
  try {
    const r = IDBKeyRange.bound(id + ':', id + ':\uffff');
    for (const st of ['s', 'v', 'vid', 'bg', 'pvid', 'cal']) { try { await dbDo('readwrite', s => { s.delete(r); }, st); } catch (e) {} }
  } catch (e) { console.warn('media wipe skipped', e); }
}
async function secureLogout() {
  const p = cur; if (!p) return;
  try {
    if (p.cloud) {
      const unsynced = () => (Number(localStorage.getItem('unex_ts__' + p.id)) || 0) > (Number(localStorage.getItem('unex_synced__' + p.id)) || 0);
      if (navigator.onLine && signedIn()) { toast('Saving your notes online…'); clearTimeout(syncTimer); await pushCloud(); }
      if (unsynced() && !confirm('Some changes are not saved online yet and will be lost if you log out. Log out anyway?')) return;
      if (!confirm('Log out and wipe this device? Your notes stay safe in your account, and you can sign in again any time.')) return;
    } else {
      if (confirm('Download a backup file of your notes first?')) { try { downloadBackup(); } catch (e) { toast('The backup download did not work.'); } }
      if (!confirm('This profile exists only on this device. Logging out will DELETE all its notes here for good. Continue?')) return;
    }
    logAct('logout', 'wipe'); flushAct(); if (rec && rec.state === 'recording') rec.stop(); player.pause();
    try { await unregisterPush(); } catch (e) {}
    try { if (p.cloud && fbAuth) await fbAuth.signOut(); } catch (e) { console.warn('signOut', e); }
    try { ['firebaseLocalStorageDb', 'firebase-installations-database', 'firebase-heartbeat-database'].forEach(n => indexedDB.deleteDatabase(n)); } catch (e) {}
    await wipeMedia(p.id);
    Object.keys(localStorage).forEach(k => { if (k.endsWith('__' + p.id)) localStorage.removeItem(k); });
    [PASS_KEY, STORE_KEY, TRASH_KEY, BACKUP_DATA_KEY, SECTRASH_KEY].forEach(k => localStorage.removeItem(k));
    profiles = profiles.filter(x => x.id !== p.id); saveProfiles(); if (!profiles.length) localStorage.clear();
    sessionStorage.clear();
    document.querySelectorAll('#book, #menuPanel, #commPanel, #actPanel, #lockOverlay, #deco, #wm').forEach(n => { n.innerHTML = ''; n.style.display = 'none'; });
    cur = null; topics = []; act = null; replaceRoute('login');
    location.replace(location.pathname + '#/login'); location.reload();
  } catch (e) { console.warn('logout error', e); toast('Logout did not finish. Please try again.'); }
}
function removeThisProfile() { secureLogout(); }
